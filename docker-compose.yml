services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospector}
      POSTGRES_DB: ${POSTGRES_DB:-prospector}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-prospector} -d ${POSTGRES_DB:-prospector}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
